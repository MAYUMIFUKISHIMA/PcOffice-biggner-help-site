<h1>平均を計算したい</h1>
<figure><img src="../images/AVERAGE.png" alt="上部の数式バーに =AVERAGE(B6:B7)、下の赤枠に計算結果が表示されています。"><figcaption>上部の数式バーに =AVERAGE(B6:B7)、下の赤枠に計算結果が表示されています。</figcaption></figure>
<p>訪問件数など、数値が入力された欄の平均を求めます。</p>
<section><h2>操作手順</h2>
<ol>
  <li>結果を表示する空欄をクリックします。例ではB8（B列の8行目）です。</li>
  <li>半角で =AVERAGE(B6:B7) と入力します。AVERAGEは平均を求める命令、B6:B7はB6からB7までです。</li>
  <li>Enter を押します。平均値が表示されます。</li>
</ol>
</section>
<section class="check"><h2>できたか確認</h2><p>B6が2、B7が4なら、平均は3です。</p></section>
<section class="note"><h2>注意点</h2><p>空欄は計算の対象外ですが、0を入力した欄は対象です。</p></section>
