<h1>数字を合計したい</h1>
<p>連続した欄にある数字を足し合わせます。</p>
<section><h2>操作手順</h2>
<ol>
  <li>結果を出す空欄をクリックします。例ではB8（B列の8行目）です。</li>
  <li>半角で =SUM(B6:B7) と入力します。SUMは合計、コロンは「最初の欄から最後の欄まで」です。</li>
  <li>Enter を押します。入力した式が計算結果に変わります。</li>
</ol>
<figure><img src="../images/SUM.png" alt="上部の数式バーに =SUM(B6:B7)、下の赤枠に計算結果が表示されています。"><figcaption>上部の数式バーに =SUM(B6:B7)、下の赤枠に計算結果が表示されています。</figcaption></figure>
</section>
<section class="check"><h2>できたか確認</h2><p>B6に2、B7に4なら、結果は6です。</p></section>
<section class="note"><h2>注意点</h2><p>合計を出す欄自体を集計する範囲に含めないでください。</p></section>
